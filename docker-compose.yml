version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: huit_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password@123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: huit_ml_service
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
    volumes:
      - ./model:/app/model:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: huit_backend_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:Password@123@sqlserver:1433/qlcv?driver=ODBC+Driver+17+for+SQL+Server
      - ML_SERVICE_URL=http://ml-service:8001
      - JWT_SECRET=khoa-bi-mat-khoa-luan-cntt-klcn184-2026-2027
    depends_on:
      - sqlserver
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huit_frontend_ui
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
